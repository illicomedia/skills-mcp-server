name: Scorecard

# OpenSSF Scorecard: rates the repository's security practices (branch protection, pinned
# dependencies, token permissions, signed releases, CI tests, ...) every week and after changes
# to main or to branch protection. Results go to GitHub code scanning and to the public
# Scorecard API, which serves the README badge.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  branch_protection_rule:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the repository it rates
      actions: read # read workflow runs and settings it rates
      security-events: write # upload the results to GitHub code scanning
      id-token: write # publish the results to the Scorecard API (README badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
