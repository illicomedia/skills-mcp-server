name: Scorecard

# OpenSSF Scorecard: rates the repository's security practices (branch protection, pinned
# dependencies, token permissions, signed releases, CI tests, ...) every week and after changes
# to main or to branch protection. Results go to GitHub code scanning and to the public
# Scorecard API, which serves the README badge.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  branch_protection_rule:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the repository it rates
      actions: read # read workflow runs and settings it rates
      security-events: write # upload the results to GitHub code scanning
      id-token: write # publish the results to the Scorecard API (README badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
