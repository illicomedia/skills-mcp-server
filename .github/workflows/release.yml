name: Release

# The only way a version reaches npm. A maintainer runs `pnpm release` locally (which refuses
# unless GitHub CI is green on the commit), and it pushes a v<version> tag. This workflow then:
#   1. checks the tag matches package.json,
#   2. runs the whole CI workflow (ci.yml) on the tagged commit,
#   3. only if every CI job is green: packs once, smoke-tests that tarball,
#   4. stages that exact tarball on npm under the `next` dist-tag with a provenance attestation
#      (npm Trusted Publishing, no npm token); it goes public only when a maintainer approves it
#      with 2FA (`npm stage approve`): the trusted publisher may stage, not publish,
#   5. creates the GitHub Release.
# `latest` moves later, with `pnpm release --promote <version>`.
#
# Every step calls a command of scripts/release.mjs, covered by the test suite; no logic lives
# in shell here. No job restores a package cache (zizmor: cache-poisoning).
#
# One-time setup: npmjs.com > package settings > Trusted Publisher > GitHub Actions,
# repository illicomedia/skills-mcp-server, workflow release.yml, environment npm-publish,
# "Publish directly" and "Manage dist-tags" left unchecked (staged publishing only);
# GitHub environment npm-publish with a deployment rule of type Tag, pattern v*.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v2.0.0'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  tag:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The tag must match package.json (prints ref, name, version)
        id: meta
        run: node scripts/release.mjs --check-tag "$TAG" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.ref }}
    permissions:
      contents: read

  build:
    name: Pack and smoke-test
    needs: [tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Pack once
        run: pnpm pack --pack-destination release
      - name: Smoke-test the exact tarball that will be published
        run: node scripts/release.mjs --smoke-only --tarball-dir release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Stage on npm under next
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Stage for publishing (a maintainer approves it with 2FA)
        run: node scripts/release.mjs --stage --tarball-dir release

  github-release:
    name: GitHub Release
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release and attach the tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release with its notes and tarball (skipped when it exists)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs --github-release "$TAG" --tarball-dir release
