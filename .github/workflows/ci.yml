name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole workflow on the release tag; publishing waits for it to be green.
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (the release tag)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, build, test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Development tooling (type stripping, coverage thresholds) needs the latest of each line.
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Type-check the tests (against the built dist/)
        run: pnpm run lint:types
      - name: Dead code (knip)
        run: pnpm run lint:dead
      - name: Duplicated code (jscpd)
        run: pnpm run lint:duplicates
      - name: Build and test with the 100% coverage gate
        run: pnpm run test:coverage
      - name: Check package metadata (publint)
        run: pnpm run lint:package

  package:
    name: Pack the release tarball
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm pack --pack-destination packed
      # The release path up to staging, on every push: tag logic, release notes, npm client,
      # tarball, and a dry run of the exact staging command (scripts/release/ci.mjs rehearse).
      - name: Rehearse the release
        run: node scripts/release.mjs --rehearse --tarball-dir packed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: packed/*.tgz
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Installed package runs (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every line of package.json "engines", at its first and its latest release.
        node-version: [22.0.0, 22.x, 24.0.0, 24.x, 26.0.0, 26.x]
        include:
          - os: windows-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 24.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: packed
      - name: Install the tarball into an empty project and run an MCP session
        shell: bash
        run: node scripts/release.mjs --smoke-only --tarball-dir packed

  refused:
    name: Installed package refuses Node ${{ matrix.node-version }} (no security fixes)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: packed
      - name: The installed server must exit with a FATAL message instead of starting
        run: node scripts/release.mjs --expect-refusal --tarball-dir packed

  workflows:
    name: Lint and audit GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Build the digest-pinned actionlint image
        run: docker build --quiet --tag actionlint-pinned .github/actionlint
      # Sealed: no network, read-only repository and filesystem, no capabilities, no privilege
      # escalation, not root. Even a tampered image could not exfiltrate or change anything.
      - name: actionlint
        run: >-
          docker run --rm
          --network none
          --read-only --tmpfs /tmp
          --cap-drop ALL
          --security-opt no-new-privileges
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/repo:ro" --workdir /repo
          actionlint-pinned -color
      - name: Build the digest-pinned zizmor image
        run: docker build --quiet --tag zizmor-pinned .github/zizmor
      # zizmor audits the workflows for security problems (injection, permissions, credentials,
      # cache poisoning); sealed the same way, offline. Exceptions live in .github/zizmor.yml.
      - name: zizmor
        run: >-
          docker run --rm
          --network none
          --read-only --tmpfs /tmp
          --cap-drop ALL
          --security-opt no-new-privileges
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/repo:ro" --workdir /repo
          zizmor-pinned --offline --config .github/zizmor.yml .github/workflows
