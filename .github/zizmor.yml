# zizmor configuration. Every exception states why; see docs/engineering/decisions.md (D18).
rules:
  # zizmor suggests the newer `$/...` form for calling a workflow of this repository.
  # actionlint 1.7.12 rejects it ("not following the format ... ./path/to/workflow.yml"),
  # so release.yml keeps `uses: ./.github/workflows/ci.yml`. Revisit when actionlint accepts it.
  self-repository:
    disable: true
